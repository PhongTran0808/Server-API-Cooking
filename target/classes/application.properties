# Server Configuration
server.port=8081

# Database Configuration - MySQL
# Hỗ trợ 2 dạng biến: DB_* (code lỗi) và SECURE_DB_* (code fix)
# Cả 2 đều chạy được nhờ fallback
spring.datasource.url=jdbc:mysql://${SECURE_DB_HOST:${DB_HOST:localhost}}:${SECURE_DB_PORT:${DB_PORT:3306}}/${SECURE_DB_NAME:${DB_NAME:cooking_app}}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${SECURE_DB_USER:${DB_USERNAME:root}}
spring.datasource.password=${SECURE_DB_PASS:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:8080,https://localhost:8443
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging Configuration
logging.level.com.cookingapp=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Configuration
app.name=Cooking App Server
app.version=1.0.0
app.description=REST API Server for Cooking Application